<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NAS - File Uploads</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <span class="navbar-brand">Welcome, <span id="username"></span></span>
                <div>
                    <button id="adminBtn" class="btn btn-outline-light" onclick="window.location.href='manage.html'" style="display: none">Manage</button>
                    <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
                </div>
            </div>
        </nav>
        <div class="container my-4">
            <h2 class="text-center mb-4">Upload Your File</h2>
            <div id="dropzone" class="border border-primary rounded p-5 text-center text-muted mx-auto" style="cursor: pointer; max-width: 500px;">
                <p>Drag & Drop files here or click to select</p>
                <input type="hidden" name="action" value="upload_file">
                <input type="file" id="fileInput" style="display: none;">
            </div>
            <div class="p-1 text-center text-muted">
                <label id="uploadResult"></label>
            </div>
        </div>
        <table class="container table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Filename</th>
                </tr>
            </thead>
            <tbody id="uploadedFiles">
            </tbody>
        </table>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            async function check_session_and_get_username() {
                let session = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('session='))
                    ?.split('=')[1];
                if (!session) {
                    window.location.href = "/login.html";
                }
                let user = await fetch(`/cgi-bin/controller.cgi?action=check_session&session=${session}`).then(response => response.text());
                if (!user) {
                    window.location.href = "/login.html";
                }
                document.getElementById('username').innerHTML = user;
                if (user === 'admin') {
                    document.getElementById('adminBtn').style.display = 'inline';
                } else {
                    document.getElementById('adminBtn').style.display = 'none';
                }
            }

            async function get_uploaded_files() {
                // In progress
            }

            async function on_load() {
                await check_session_and_get_username();
                await get_uploaded_files();
            }
            on_load();

            // Add event for logout button
            document.getElementById('logoutBtn').addEventListener('click', function() {
                document.cookie = "session=";
                location.reload();
            });

            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');

            // Click to open file picker
            dropzone.addEventListener('click', () => fileInput.click());

            // When selecting file via input
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

            // Drag drop handler
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('bg-info');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('bg-info');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('bg-info');
                handleFiles(e.dataTransfer.files);
            });

            function handleFiles(files) {
                if (files.length === 0) return;

                // In progress
            }
        </script>
    </body>
</html>
